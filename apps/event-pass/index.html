<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Libre+Barcode+128&display=swap"
    rel="stylesheet">
  <title>Event Pass | OppSkills</title>
</head>

<body>
  <div class="ticket-visual_visual" id="ticket">
    <div class="left"></div>
    <div class="right"></div>
    <div class="ticket-visual-wrapper">
      <!-- Vertical dashed line separator -->
      <div class="vertical-separator"></div>

      <div class="ticket-content">
        <!-- Left Section -->
        <div class="ticket-left">
          <!-- Top: Attendee Details -->
          <div class="attendee-section-left">
            <img
              src="https://img.clerk.com/eyJ0eXBlIjoicHJveHkiLCJzcmMiOiJodHRwczovL2ltYWdlcy5jbGVyay5kZXYvb2F1dGhfZ29vZ2xlL2ltZ18zN25NdW5WSm1qZXQ2Yk1xNEtqNVJiWGVIQzkifQ?width=160"
              alt="Attendee" class="attendee-image-left" />
            <div class="attendee-info-left">
              <p class="attendee-name">Utkarsh Khare</p>
              <p class="attendee-college">IIT Delhi</p>
              <p class="attendee-email">utkarsh@iitd.ac.in</p>
            </div>
          </div>

          <!-- Bottom: Event Info Row -->
          <div class="event-row">
            <div class="event-name-section">
              <h1 class="event-name">GCET Freshers</h1>
            </div>
            <div class="event-datetime">
              <p class="event-date">January 15, 2026</p>
              <p class="event-time">10:00 AM onwards</p>
            </div>
          </div>

          <!-- Presented By -->
          <div class="presented-by">
            <span class="presented-text">Presented by</span>
            <img src="./oppskills.png" alt="OppSkills" class="oppskills-logo" />
          </div>
        </div>

        <!-- Right Section -->
        <div class="ticket-right">
          <div class="ticket-right-content">
            <span class="ticket-id-vertical">№ 001429</span>
            <img src="./barcode.jpeg" alt="Barcode" class="barcode-image" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ticketElm = document.getElementById('ticket');
    const { x, y, width, height } = ticketElm.getBoundingClientRect();
    const centerPoint = { x: x + width / 2, y: y + height / 2 };

    window.addEventListener('mousemove', (e) => {
      const degreeX = (e.clientY - centerPoint.y) * 0.006;
      const degreeY = (e.clientX - centerPoint.x) * -0.006;

      ticketElm.style.transform = `perspective(1000px) rotateX(${degreeX}deg) rotateY(${degreeY}deg)`;
    });
  </script>
</body>

</html>
