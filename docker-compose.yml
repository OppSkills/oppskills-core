services:
  postgres:
    image: postgres:16
    container_name: oppskills-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: oppskills
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_oppskills:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: oppskills-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data_oppskills:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Local WebRTC SFU for community meets (dev only — uses LiveKit default dev credentials)
  livekit:
    image: livekit/livekit-server:latest
    container_name: oppskills-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

volumes:
  postgres_data_oppskills:
  redis_data_oppskills:
