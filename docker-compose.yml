version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: oppskills-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: oppskills
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_oppskills:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oppskills"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data_oppskills:
