name: AI PR Description

on:
  push:
    branches:
      - vijay/onboard
  workflow_dispatch:   # Allows manual testing

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Get open PR for this branch (if exists)
      - name: Find PR for branch
        id: pr
        uses: peter-evans/find-pull-request@v2
        with:
          state: open
          head: vijay/onboard

      # Step 3: Get diff against main
      - name: Get code diff
        id: diff
        run: |
          git fetch origin main
          DIFF=$(git diff origin/main...vijay/onboard)
          echo "DIFF_CONTENT<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 4: Generate description using Gemini Flash 2.5
      - name: Generate AI PR description
        id: ai
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": \"Write a clean, structured PR description summarizing these code changes:\n\n${{ steps.diff.outputs.DIFF_CONTENT }}\"
                }]
              }]
            }" | jq -r '.candidates[0].content.parts[0].text')
          echo "DESC=$RESPONSE" >> $GITHUB_OUTPUT
          echo "AI PR Description Generated:"
          echo "$RESPONSE"

      # Step 5: Update PR description if PR exists
      - name: Update PR description (if PR exists)
        if: steps.pr.outputs.pull-request-number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.pull-request-number }}
          body: |
            ### AI Generated PR Description
            ${{ steps.ai.outputs.DESC }}

      # Step 6: Fallback log if no PR
      - name: Log AI description if no PR
        if: steps.pr.outputs.pull-request-number == ''
        run: |
          echo "No PR found. Here is the generated description:"
          echo "${{ steps.ai.outputs.DESC }}"
