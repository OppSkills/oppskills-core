name: AI PR Description

on:
  push:
    branches:
      - vijay/onboard
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate_pr_description:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Find PR for this branch (if any)
      - name: Find PR for this branch
        id: pr
        uses: jwalton/gh-find-current-pr@v1.3.3
        with:
          state: open

      # Step 3: Fetch main and feature branch, get safe diff
      - name: Get code diff
        id: diff
        run: |
          FEATURE_BRANCH=${GITHUB_REF#refs/heads/}
          git fetch origin main
          git fetch origin $FEATURE_BRANCH
          # Use safe diff: compares branch against main without merge-base errors
          DIFF=$(git diff origin/main $FEATURE_BRANCH)
          echo "DIFF_CONTENT<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Step 4: Generate AI PR description using Gemini
      - name: Generate PR description with Gemini
        id: ai
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": \"Write a clean, structured PR description summarizing these code changes:\\n\\n${{ steps.diff.outputs.DIFF_CONTENT }}\"
                }]
              }]
            }" | jq -r '.candidates[0].content.parts[0].text')
          echo "DESC=$RESPONSE" >> $GITHUB_OUTPUT
          echo "Generated Description:\\n$RESPONSE"

      # Step 5: Post description to PR if it exists
      - name: Post description to PR
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.pr.outputs.number }}
          body: |
            ### 🤖 AI-Generated PR Description
            ${{ steps.ai.outputs.DESC }}

      # Step 6: Log description if no PR found
      - name: Log description if no PR found
        if: steps.pr.outputs.number == ''
        run: |
          echo "No PR found for this branch. Here is the generated description:"
          echo "${{ steps.ai.outputs.DESC }}"
