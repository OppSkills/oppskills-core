name: Trigger Vercel Deploy for UI Landing

on:
  pull_request:
    branches:
      - main
    types:
      - opened    # When PR is created
      - closed    # When PR is merged
    paths:
      - "apps/ui-landing/**"

permissions:
  contents: write

jobs:
  trigger-vercel-deploy:
    runs-on: ubuntu-latest
    # Run if: PR opened OR PR merged (not just closed)
    if: |
      github.event.action == 'opened' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'opened' && github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Configure Git user for Vercel deployment
        run: |
          git config user.name "Vercel Deploy Bot"
          git config user.email "khareu450@gmail.com"

      - name: Create empty commit to trigger Vercel
        run: |
          git commit --allow-empty -m "chore: trigger vercel deployment"

      - name: Push changes
        run: |
          git push origin ${{ github.event.action == 'opened' && github.head_ref || 'main' }}
