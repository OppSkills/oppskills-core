name: Trigger Vercel Deploy for UI Landing

on:
  # Trigger on direct push to main
  push:
    branches:
      - main
    paths:
      - "apps/ui-landing/**"

  # Trigger when PR is merged to main
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "apps/ui-landing/**"

permissions:
  contents: write

jobs:
  trigger-vercel-deploy:
    runs-on: ubuntu-latest
    # Run if: (push event OR merged PR) AND not from this bot
    if: |
      (github.event_name == 'push' || github.event.pull_request.merged == true) &&
      github.event.head_commit.author.email != 'khareu450@gmail.com'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git user for Vercel deployment
        run: |
          git config user.name "Vercel Deploy Bot"
          git config user.email "khareu450@gmail.com"

      - name: Create empty commit to trigger Vercel
        run: |
          git commit --allow-empty -m "chore: trigger vercel deployment"

      - name: Push changes
        run: |
          git push origin main
