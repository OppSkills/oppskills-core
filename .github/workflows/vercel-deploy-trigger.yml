name: Trigger Vercel Deploy for UI Landing

on:
  pull_request:
    branches:
      - main
    types:
      - opened # PR created
      - synchronize # New commits pushed to PR
    paths:
      - "apps/ui-landing/**"

  push:
    branches:
      - main
    paths:
      - "apps/ui-landing/**"

permissions:
  contents: write

jobs:
  trigger-preview-deploy:
    # For PR preview deployments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Check if last commit is from bot (prevent infinite loop)
        id: check
        run: |
          LAST_AUTHOR=$(git log -1 --format='%ae')
          if [ "$LAST_AUTHOR" = "khareu450@gmail.com" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git user for Vercel
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Vercel Deploy Bot"
          git config user.email "khareu450@gmail.com"

      - name: Create commit to trigger Vercel preview
        if: steps.check.outputs.skip != 'true'
        run: |
          git commit --allow-empty -m "chore: trigger vercel preview deploy"
          git push origin ${{ github.head_ref }}

  trigger-production-deploy:
    # For production deployments after merge
    if: |
      github.event_name == 'push' &&
      github.event.head_commit.author.email != 'khareu450@gmail.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git user for Vercel
        run: |
          git config user.name "Vercel Deploy Bot"
          git config user.email "khareu450@gmail.com"

      - name: Create commit to trigger Vercel production deploy
        run: |
          git commit --allow-empty -m "chore: trigger vercel production deploy"
          git push origin main
