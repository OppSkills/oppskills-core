name: Trigger Vercel Deploy for UI Landing

on:
  pull_request:
    branches:
      - main
    types:
      - opened # PR created
    paths:
      - "apps/ui-landing/**"

  # Trigger when PR is approved (just before merge)
  pull_request_review:
    types:
      - submitted

  push:
    branches:
      - main
    paths:
      - "apps/ui-landing/**"

permissions:
  contents: write

jobs:
  trigger-preview-deploy:
    # Run on PR opened OR when PR is approved
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Check if should skip (prevent infinite loop)
        id: check
        run: |
          LAST_AUTHOR=$(git log -1 --format='%ae')
          LAST_MSG=$(git log -1 --format='%s')
          echo "Last commit author: $LAST_AUTHOR"
          echo "Last commit message: $LAST_MSG"
          if [ "$LAST_AUTHOR" = "khareu450@gmail.com" ] || [[ "$LAST_MSG" == *"trigger vercel"* ]]; then
            echo "Skipping - already triggered"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git and push trigger commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Vercel Deploy Bot"
          git config user.email "khareu450@gmail.com"
          git commit --allow-empty -m "chore: trigger vercel preview deploy"
          git push origin ${{ github.event.pull_request.head.ref }}

  trigger-production-deploy:
    if: |
      github.event_name == 'push' &&
      github.event.head_commit.author.email != 'khareu450@gmail.com' &&
      !contains(github.event.head_commit.message, 'trigger vercel')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git and push trigger commit
        run: |
          git config user.name "Vercel Deploy Bot"
          git config user.email "khareu450@gmail.com"
          git commit --allow-empty -m "chore: trigger vercel production deploy"
          git push origin main
