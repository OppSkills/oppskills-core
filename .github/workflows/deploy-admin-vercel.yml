name: Deploy Admin to Vercel

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-admin-vercel.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (e.g. Bob the Builder)"
        required: false
        type: string
        default: "manual"

concurrency:
  group: "deploy-admin-vercel"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Google Chat (start)
        if: ${{ secrets.GCHAT_WEBHOOK_URL != '' }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"🚀 Admin deploy started\\nActor: ${{ github.actor }}\\nCommit: ${{ github.sha }}\\nReason: ${{ github.event.inputs.reason || 'push' }}\"}" \
            "${{ secrets.GCHAT_WEBHOOK_URL }}" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm (corepack)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm dlx vercel@latest --version

      - name: Deploy (admin)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: |
          cd apps/admin
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Notify Google Chat (success)
        if: ${{ success() && secrets.GCHAT_WEBHOOK_URL != '' }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ Admin deploy succeeded\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.GCHAT_WEBHOOK_URL }}" || true

      - name: Notify Google Chat (failure)
        if: ${{ failure() && secrets.GCHAT_WEBHOOK_URL != '' }}
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ Admin deploy FAILED\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.GCHAT_WEBHOOK_URL }}" || true

