name: Deploy backend to EC2 (ECR)

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "scripts/load-secrets.mjs"
      - "load-secrets.mts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-backend-ec2.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (default: current commit SHA)"
        required: false
        type: string
      run_migrations:
        description: "Run `prisma migrate deploy` on container start (default: false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: "deploy-backend-ec2"
  cancel-in-progress: true

env:
  AWS_REGION: "us-east-1"
  ECR_REGISTRY: "443512646680.dkr.ecr.us-east-1.amazonaws.com"
  ECR_REPOSITORY: "oppskills-core"
  CONTAINER_NAME: "oppskills-backend"
  CONTAINER_PORT: "3001"
  AWS_SECRETS_ID: "oppskills-env"
  # IMPORTANT: leave this disabled by default. Failed production migrations (P3009) will crash the container
  # and put it into a restart loop. Use workflow_dispatch with run_migrations=true once migration state is healthy.
  RUN_MIGRATIONS: "${{ github.event.inputs.run_migrations || 'false' }}"

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
          fi

          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${TAG}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image (without pushing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.prod
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Test Docker image locally
        env:
          ECR_IMAGE: ${{ steps.meta.outputs.image }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        run: |
          set -euo pipefail

          echo "Testing Docker image before pushing to ECR..."

          # Create a minimal env file for testing (no real secrets needed)
          cat > /tmp/test.env <<EOF
          NODE_ENV=production
          PORT=${CONTAINER_PORT}
          DATABASE_URL=postgresql://test:test@localhost:5432/test?schema=oppskills
          REDIS_URL=redis://localhost:6379
          CLERK_SECRET_KEY=sk_test_dummy
          CLERK_WEBHOOK_SECRET=whsec_dummy
          MEDIA_S3_BUCKET=test-bucket
          MEDIA_CLOUDFRONT_BASE_URL=https://test.cloudfront.net
          MEDIA_MAX_UPLOAD_BYTES=10485760
          EOF

          # Run container in test mode (skip secrets loader and migrations)
          docker run -d \
            --name test-backend \
            -p ${CONTAINER_PORT}:${CONTAINER_PORT} \
            --env-file /tmp/test.env \
            -e RUN_SECRETS_LOADER=false \
            -e RUN_MIGRATIONS=false \
            "${ECR_IMAGE}"

          # Wait for container to be ready (max 30 seconds)
          echo "Waiting for container to start..."
          for i in {1..30}; do
            if docker ps | grep -q test-backend; then
              echo "✓ Container is running"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Container failed to start"
              docker logs test-backend
              docker rm -f test-backend 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Wait for health endpoint (max 45 seconds)
          echo "Testing health endpoint..."
          HEALTH_OK=false
          for i in {1..45}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${CONTAINER_PORT}/health || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "✓ Health check passed!"
              HEALTH_RESPONSE=$(curl -s http://localhost:${CONTAINER_PORT}/health)
              echo "Response: ${HEALTH_RESPONSE}"
              HEALTH_OK=true
              break
            fi
            if [ $i -eq 45 ]; then
              echo "✗ Health check failed after 45 seconds (HTTP ${HTTP_CODE})"
              echo "Container logs:"
              docker logs test-backend
              docker rm -f test-backend
              exit 1
            fi
            echo "Waiting for health endpoint... ($i/45) [HTTP ${HTTP_CODE}]"
            sleep 1
          done

          # Cleanup
          docker rm -f test-backend
          rm -f /tmp/test.env

          if [ "${HEALTH_OK}" = "true" ]; then
            echo "✓ Docker image is healthy and ready to push!"
          else
            echo "✗ Docker image failed health check"
            exit 1
          fi

      - name: Push Docker image to ECR
        run: |
          set -euo pipefail
          echo "Health check passed! Pushing image to ECR..."
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "✓ Image pushed successfully!"

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          ECR_IMAGE: ${{ needs.build_and_push.outputs.image }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST}" ]; then
            echo "Missing required secret: EC2_HOST"
            exit 1
          fi
          if [ -z "${EC2_USER}" ]; then
            echo "Missing required secret: EC2_USER"
            exit 1
          fi
          if [ -z "${EC2_SSH_PRIVATE_KEY}" ]; then
            echo "Missing required secret: EC2_SSH_PRIVATE_KEY"
            exit 1
          fi

          SSH_PORT="${EC2_SSH_PORT:-22}"

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          echo "${EC2_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_rsa"
          chmod 600 "${HOME}/.ssh/id_rsa"

          # Add host key to known_hosts (prevents interactive prompt).
          # If you want strict pinning, we can switch this to a stored `EC2_KNOWN_HOSTS` secret.
          ssh-keyscan -p "${SSH_PORT}" -H "${EC2_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

          echo "Deploying image: ${ECR_IMAGE}"

          ssh -p "${SSH_PORT}" "${EC2_USER}@${EC2_HOST}" \
            "AWS_REGION='${AWS_REGION}' \
             ECR_REGISTRY='${ECR_REGISTRY}' \
             ECR_REPOSITORY='${ECR_REPOSITORY}' \
             ECR_IMAGE='${ECR_IMAGE}' \
             CONTAINER_NAME='${CONTAINER_NAME}' \
             CONTAINER_PORT='${CONTAINER_PORT}' \
             AWS_SECRETS_ID='${AWS_SECRETS_ID}' \
             RUN_MIGRATIONS='${RUN_MIGRATIONS}' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          command -v aws >/dev/null 2>&1 || (echo "aws cli not installed" && exit 1)
          command -v docker >/dev/null 2>&1 || (echo "docker not installed" && exit 1)

          # Resolve a docker command that works for this user:
          # - Prefer plain `docker`
          # - Fall back to `sudo -n docker` (requires NOPASSWD sudo)
          USE_SUDO_DOCKER="0"
          if ! docker info >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              USE_SUDO_DOCKER="1"
            else
              echo "Docker is installed but this user cannot access /var/run/docker.sock."
              echo "Fix options: add user to docker group OR allow sudo docker (NOPASSWD) OR run workflow with a different SSH user."
              exit 1
            fi
          fi

          docker_cmd() {
            if [ "${USE_SUDO_DOCKER}" = "1" ]; then
              sudo -n docker "$@"
            else
              docker "$@"
            fi
          }

          aws ecr get-login-password --region "${AWS_REGION}" | docker_cmd login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker_cmd pull "${ECR_IMAGE}"

          if docker_cmd ps -a --format "{{.Names}}" | grep -qx "${CONTAINER_NAME}"; then
            docker_cmd rm -f "${CONTAINER_NAME}"
          fi

          docker_cmd run -d --restart unless-stopped \
            --name "${CONTAINER_NAME}" \
            -p "${CONTAINER_PORT}:${CONTAINER_PORT}" \
            -e NODE_ENV=production \
            -e PORT="${CONTAINER_PORT}" \
            -e AWS_REGION="${AWS_REGION}" \
            -e AWS_SECRETS_ID="${AWS_SECRETS_ID}" \
            -e RUN_SECRETS_LOADER=true \
            -e RUN_MIGRATIONS="${RUN_MIGRATIONS}" \
            "${ECR_IMAGE}"

          # Comprehensive cleanup to prevent disk space issues
          echo "Starting comprehensive Docker cleanup on EC2..."

          # Show current disk usage
          echo "Current Docker disk usage:"
          docker_cmd system df 2>/dev/null || true

          # Remove all stopped containers
          echo "Removing stopped containers..."
          docker_cmd container prune -f >/dev/null 2>&1 || true

          # Remove old images from the same repository (keep only current and latest)
          # NOTE: This runs with `set -u`, so always use safe expansions for optional vars.
          # Prefer explicit `ECR_REPOSITORY` (passed from the workflow). If absent, derive
          # the repository from the image string (e.g. `REGISTRY/repo:tag` -> `REGISTRY/repo`).
          ECR_REPOSITORY_SAFE="${ECR_REPOSITORY:-}"
          if [ -n "${ECR_REPOSITORY_SAFE}" ]; then
            REPO_NAME="${ECR_REGISTRY}/${ECR_REPOSITORY_SAFE}"
          else
            # Strip the tag/digest, then keep `registry/repo` portion.
            REPO_NAME="${ECR_IMAGE%%@*}"
            REPO_NAME="${REPO_NAME%%:*}"
          fi
          echo "Removing old local images from ${REPO_NAME}..."
          docker_cmd images "${REPO_NAME}" --format "{{.Repository}}:{{.Tag}}" 2>/dev/null | while read -r img; do
            if [ "${img}" != "${ECR_IMAGE}" ] && [ "${img}" != "${REPO_NAME}:latest" ]; then
              echo "Removing old local image: ${img}"
              docker_cmd rmi -f "${img}" >/dev/null 2>&1 || true
            fi
          done

          # Remove all unused images (not just dangling)
          echo "Removing all unused images..."
          docker_cmd image prune -a -f >/dev/null 2>&1 || true

          # Remove unused volumes (be careful - only unused ones)
          echo "Removing unused volumes..."
          docker_cmd volume prune -f >/dev/null 2>&1 || true

          # Remove unused networks
          echo "Removing unused networks..."
          docker_cmd network prune -f >/dev/null 2>&1 || true

          # Remove build cache (can be very large)
          echo "Removing Docker build cache..."
          docker_cmd builder prune -a -f >/dev/null 2>&1 || true

          # Clean up system logs (journald) - keep last 7 days
          echo "Cleaning up system logs (keeping last 7 days)..."
          if command -v journalctl >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n journalctl --vacuum-time=7d >/dev/null 2>&1; then
              echo "System logs cleaned"
            else
              echo "Skipping system log cleanup (requires sudo or not available)"
            fi
          fi

          # Show final disk usage
          echo "Final Docker disk usage:"
          docker_cmd system df 2>/dev/null || true

          echo "✓ Comprehensive cleanup completed."
          REMOTE

          echo "SSH deploy completed."

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          CONTAINER_PORT: ${{ env.CONTAINER_PORT }}
        run: |
          set -euo pipefail

          SSH_PORT="${EC2_SSH_PORT:-22}"

          echo "Waiting for backend to be healthy..."

          ssh -p "${SSH_PORT}" "${EC2_USER}@${EC2_HOST}" \
            "CONTAINER_NAME='${CONTAINER_NAME}' \
             CONTAINER_PORT='${CONTAINER_PORT}' \
             bash -s" <<'HEALTH_CHECK'
          set -euo pipefail

          # Must match deploy step: same user may need `sudo -n docker` to talk to the daemon.
          command -v docker >/dev/null 2>&1 || (echo "docker not installed" && exit 1)
          USE_SUDO_DOCKER="0"
          if ! docker info >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              USE_SUDO_DOCKER="1"
            else
              echo "Docker is installed but this user cannot access /var/run/docker.sock."
              echo "Fix options: add user to docker group OR allow sudo docker (NOPASSWD) OR run workflow with a different SSH user."
              exit 1
            fi
          fi

          docker_cmd() {
            if [ "${USE_SUDO_DOCKER}" = "1" ]; then
              sudo -n docker "$@"
            else
              docker "$@"
            fi
          }

          # Wait for container to be running (max 30 seconds)
          echo "Checking if container is running..."
          for i in {1..30}; do
            if docker_cmd ps --format "{{.Names}}" | grep -qx "${CONTAINER_NAME}"; then
              echo "Container is running"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Container failed to start within 30 seconds"
              docker_cmd logs --tail 50 "${CONTAINER_NAME}" 2>/dev/null || true
              exit 1
            fi
            echo "Waiting for container to start... ($i/30)"
            sleep 1
          done

          # Wait for health endpoint to respond (max 60 seconds)
          echo "Checking health endpoint..."
          for i in {1..60}; do
            if curl -f -s -o /dev/null -w "%{http_code}" "http://localhost:${CONTAINER_PORT}/health" | grep -q "200"; then
              echo "✓ Health check passed!"
              curl -s "http://localhost:${CONTAINER_PORT}/health"
              exit 0
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Health check failed after 60 seconds"
              echo "Container logs:"
              docker_cmd logs --tail 100 "${CONTAINER_NAME}" 2>/dev/null || true
              echo "Container status:"
              docker_cmd ps -a | grep "${CONTAINER_NAME}" || true
              exit 1
            fi
            echo "Waiting for backend to be healthy... ($i/60)"
            sleep 1
          done
          HEALTH_CHECK

          echo "✓ Deployment successful and backend is healthy!"
