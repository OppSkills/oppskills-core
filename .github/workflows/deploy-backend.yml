name: Deploy Backend to AWS EC2 (via ECR)

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - "apps/backend/Dockerfile.prod"
      - "load-secrets.mts"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip database migrations"
        required: false
        default: "false"

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 443512646680

jobs:
  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image
          docker build -f apps/backend/Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Output image URI for next steps
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 (pull from ECR and restart container)
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          RUN_MIGRATIONS: ${{ github.event.inputs.skip_migrations == 'true' && 'false' || 'true' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: AWS_REGION,AWS_ACCOUNT_ID,ECR_REPOSITORY,IMAGE_TAG,RUN_MIGRATIONS
          script: |
            set -eu

            if ! command -v aws >/dev/null 2>&1; then
              echo "::error::AWS CLI is required on the EC2 instance (install awscli v2)."
              exit 1
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::Docker is required on the EC2 instance."
              exit 1
            fi

            # Use sudo docker if the current user doesn't have docker permissions.
            docker_cmd() { docker "$@"; }
            if ! docker ps >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                docker_cmd() { sudo docker "$@"; }
              fi
            fi

            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            echo "Logging into ECR: ${ECR_REGISTRY}"
            aws ecr get-login-password --region "${AWS_REGION}" | docker_cmd login --username AWS --password-stdin "${ECR_REGISTRY}"

            echo "Pulling image: ${IMAGE}"
            docker_cmd pull "${IMAGE}"

            echo "Restarting container: oppskills-backend"
            docker_cmd stop oppskills-backend || true
            docker_cmd rm oppskills-backend || true

            docker_cmd run -d \
              --name oppskills-backend \
              --restart unless-stopped \
              -p 127.0.0.1:3001:3001 \
              -e NODE_ENV="production" \
              -e AWS_REGION="${AWS_REGION}" \
              -e PORT="3001" \
              -e RUN_MIGRATIONS="${RUN_MIGRATIONS}" \
              "${IMAGE}"

            echo "Pruning unused images..."
            docker_cmd image prune -f

            echo "Deployment completed successfully!"
            docker_cmd ps --filter "name=oppskills-backend"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
          echo "Image: ${{ steps.build-image.outputs.image }}"
