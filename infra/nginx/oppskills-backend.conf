##
## Nginx reverse proxy for OppSkills backend (NestJS)
##
## - Proxies public traffic on 80/443 to the backend container bound on 127.0.0.1:3001
## - Suitable for Ubuntu default Nginx layout
## - After placing this file, run:
##   - sudo nginx -t
##   - sudo systemctl reload nginx
##

server {
  listen 80;
  listen [::]:80;

  # TODO: Replace with your domain (or remove server_name and use _ for catch-all).
  server_name api.oppskills.com;

  # If you are using Certbot/Let's Encrypt, Certbot will manage the 443 server block
  # and may add redirects automatically. Keep this block minimal.

  # Basic hardening
  server_tokens off;

  # Increase if you expect large uploads
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3001;

    # Websocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Preserve original host + client IP
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts (tune if you have long-running requests)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}


